<!--
    ESTILO REFERENTE AOS CARDS DOS CURSOS

    IMPORTANTE:
    - As classes deste widget utilizam o prefixo "cps-fatec-cursos"
      para reduzir conflitos com o CSS do tema/WordPress.
    - O widget não depende de JavaScript.
    - Os cards utilizam links (<a>) em vez de onclick, permitindo
      navegação por teclado, botão direito, Ctrl/Cmd + clique etc.

    FAVOR NÃO ALTERAR sem verificar o impacto no site.
-->
<style>
    /*
     * CONTAINER DOS CARDS
     *
     * Mantemos a classe "container" original do site fora do nosso CSS.
     * O espaçamento inferior continua sendo aplicado diretamente no HTML
     * para preservar o comportamento atual do widget.
     */
    .cps-fatec-cursos__cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        width: 100%;
        box-sizing: border-box;
    }

    /*
     * CARD DO CURSO
     *
     * O antigo .cardCurso utilizava width: 33%.
     *
     * Com flex-basis, os cards continuam ocupando aproximadamente
     * um terço da linha em telas maiores, mas se adaptam melhor
     * a diferentes larguras de tela.
     */
    .cps-fatec-cursos__card {
        flex: 1 1 calc(33.333% - 6px);
        max-width: 33.333%;
        border-radius: 5px;
        text-align: center;
        display: block;
        overflow: hidden;
        box-sizing: border-box;

        /*
         * Remove o sublinhado padrão do link.
         * O card inteiro funciona como área clicável.
         */
        text-decoration: none;
    }

    /*
     * IMAGEM DO CURSO
     */
    .cps-fatec-cursos__card img {
        display: block;
        margin: 0 auto;
        width: 100%;
        height: auto;
        border-radius: 5px;

        /*
         * Mantém o efeito de transição utilizado na versão original.
         */
        -webkit-transition: 0.5s;
        transition: 0.5s all ease-in-out;
    }

    /*
     * EFEITO AO PASSAR O MOUSE
     *
     * O efeito original de zoom foi mantido.
     * Como o card possui overflow:hidden, a imagem não ultrapassa
     * os limites arredondados do card.
     */
    .cps-fatec-cursos__card:hover img {
        box-shadow: 0 0 8px #999;
        transform: scale(1.1);
    }

    /*
     * ACESSIBILIDADE — NAVEGAÇÃO POR TECLADO
     *
     * :focus-visible mostra o foco somente quando necessário,
     * evitando um contorno permanente durante o uso com mouse.
     */
    .cps-fatec-cursos__card:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 3px;
    }

    /*
     * ACESSIBILIDADE — REDUÇÃO DE MOVIMENTO
     *
     * Usuários que configuraram o sistema para reduzir animações
     * não recebem o efeito de zoom.
     */
    @media (prefers-reduced-motion: reduce) {
        .cps-fatec-cursos__card img {
            -webkit-transition: none;
            transition: none;
        }

        .cps-fatec-cursos__card:hover img {
            transform: none;
        }
    }

    /*
     * RESPONSIVIDADE
     *
     * Mantemos o comportamento original de aproximadamente 95%
     * da largura em dispositivos menores, mas agora o card é
     * centralizado pelo flex container.
     */
    @media screen and (max-width: 768px) {
        .cps-fatec-cursos__card {
            flex: 0 1 95%;
            max-width: 95%;
        }
    }
</style>
