<style>
    /* Estilo para o overlay */
    .overlay-gustaffson {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }
    
    /* Conteúdo centralizado */
    .overlay-content-gustaffson {
      text-align: center;
    }
    
    /* Imagem no centro */
    .overlay-image-gustaffson {
      max-width: 80%;
      max-height: 90vh;
      margin-bottom: 30px;
    }
    
    /* Botões abaixo da imagem */
    .overlay-buttons-gustaffson {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    
    /* Estilo dos botões */
    .overlay-button-gustaffson {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    
    #inscreverBtn-gustaffson {
      background-color: #4CAF50;
      color: white;
    }
    
    #fecharBtn-gustaffson {
      background-color: #f44336;
      color: white;
    }
    
    </style>
    
    
    <div id="overlay-gustaffson" class="overlay-gustaffson">
        <div class="overlay-content-gustaffson">
          <img 
            src="https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/39/2024/11/Template_VESTIBULAR_FATECITU_I2.png" 
            alt="Imagem no centro" 
            class="overlay-image-gustaffson">
          <div class="overlay-buttons-gustaffson">
            <button id="inscreverBtn-gustaffson" class="overlay-button-gustaffson">QUERO ME INSCREVER</button>
            <button id="fecharBtn-gustaffson" class="overlay-button-gustaffson">FECHAR</button>
          </div>
        </div>
      </div>
    
      <script>
    
    // Botão "FECHAR" para esconder o overlay
    document.getElementById('fecharBtn-gustaffson').addEventListener('click', function () {
      document.getElementById('overlay-gustaffson').style.display = 'none';
    });
    
    // Botão "QUERO ME INSCREVER" para redirecionar
    document.getElementById('inscreverBtn-gustaffson').addEventListener('click', function () {
      window.location.href = 'https://vestibular.fatec.sp.gov.br/';
    });
    
    
    </script>
