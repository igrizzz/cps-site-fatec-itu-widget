
<!-- =========================================================
     VIDEO PLAYER / HERO SLIDER — INÍCIO
     =========================================================
     
     Componente utilizado como destaque principal da página.

     Estrutura:
     - Vídeo em segundo plano
     - Overlay gráfico
     - Chamada para ação
     - Mensagens rotativas

     O componente utiliza CSS e JavaScript isolados para
     evitar conflitos com outros elementos do site.
     ========================================================= -->


<style>

    /* =========================================================
       CONTAINER PRINCIPAL
       ========================================================= */

    .cps-video-hero {
        position: relative;
        width: 100%;
        height: 400px;
        overflow: hidden;
        border-radius: 10px;
    }


    /* =========================================================
       VIDEO
       ========================================================= */

    .cps-video-hero__video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }


    /* =========================================================
       OVERLAY
       =========================================================
       
       Camada utilizada para aplicar a textura e a tonalidade
       azul sobre o vídeo, facilitando a leitura do conteúdo.
       ========================================================= */

    .cps-video-hero__overlay {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        background-color: #0f5494;
        background-image: url("https://bkpsitecpsnew.blob.core.windows.net/uploadsitecps/sites/39/2024/02/dots-mini-light.png");
        background-position: center center;
        background-repeat: repeat;

        opacity: 0.3;

        pointer-events: none;
    }


    /* =========================================================
       ÁREA DE CONTEÚDO
       ========================================================= */

    .cps-video-hero__content {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;
    }


    /* =========================================================
       BOTÃO PRINCIPAL
       =========================================================
       
       O elemento é um link porque sua função é levar o usuário
       para outra página.
       ========================================================= */

    .cps-video-hero__button {
        position: absolute;

        top: 50%;
        right: 15%;

        transform: translateY(-50%);

        font-size: 18px;
        color: #fafafa;
    }


    /* =========================================================
       TÍTULO / MENSAGEM
       ========================================================= */

    .cps-video-hero__headline {
        position: absolute;

        top: 50%;
        left: 16%;

        transform: translateY(-50%);

        max-width: 50%;

        font-size: 30px;

        color: #fafafa;

        text-shadow: 2px 2px #00000075;
    }


    /* =========================================================
       SLIDER DE MENSAGENS
       ========================================================= */

    .cps-video-hero__slider {
        position: relative;
        max-width: 1000px;
        margin: auto;
    }


    /*
     * Os slides permanecem ocultos até serem ativados pelo
     * JavaScript.
     */

    .cps-video-hero__slide {
        display: none;
    }

    .cps-video-hero__slide.is-active {
        display: block;
    }


    /* =========================================================
       ANIMAÇÃO
       ========================================================= */

    .cps-video-hero__slide.is-entering {
        animation: cps-video-hero-fade 1.5s;
    }


    @keyframes cps-video-hero-fade {

        from {
            opacity: 0.4;
        }

        to {
            opacity: 1;
        }

    }


    /* =========================================================
       ACESSIBILIDADE — REDUÇÃO DE MOVIMENTO
       =========================================================
       
       Usuários que solicitaram redução de movimento no sistema
       não recebem a animação de transição.
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

        .cps-video-hero__slide.is-entering {
            animation: none;
        }

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media only screen and (max-width: 768px) {

        .cps-video-hero__button {
            top: 60%;
            right: 15%;
        }


        .cps-video-hero__headline {
            top: 30%;
            left: 0;

            width: 100%;
            max-width: none;

            padding-right: 20px;
            padding-left: 20px;

            text-align: center;
        }

    }


    /* =========================================================
       TELAS MUITO PEQUENAS
       ========================================================= */

    @media only screen and (max-width: 300px) {

        .cps-video-hero__headline {
            font-size: 11px;
        }

    }

</style>


<!-- =========================================================
     VIDEO PLAYER / HERO
     ========================================================= -->

<section

             =================================================

        <a
            class="cps-btn__destaque cps-video-hero__button"

            Conheça a Fatec Itu
        </a>

<!-- =========================================================
     SCRIPT — SLIDER DE MENSAGENS
     ========================================================= -->

<script>

    /*
     * =========================================================
     * VIDEO PLAYER / SLIDER
     * =========================================================
     *
     * O código é encapsulado em uma função para impedir que
     * variáveis e funções sejam adicionadas ao escopo global
     * da página.
     *
     * Isso é especialmente importante em um ambiente WordPress,
     * onde vários widgets podem compartilhar a mesma página.
     * =========================================================
     */

    (() => {

        /*
         * -----------------------------------------------------
         * CONFIGURAÇÕES
         * -----------------------------------------------------
         */

        const SLIDE_INTERVAL = 12500;


        /*
         * -----------------------------------------------------
         * ELEMENTOS
         * -----------------------------------------------------
         */

        const hero =
            document.querySelector('.cps-video-hero');

        if (!hero) {
            return;
        }


        const slides = Array.from(
            hero.querySelectorAll(
                '.cps-video-hero__slide'
            )
        );


        /*
         * Não inicializa o slider caso nenhum slide tenha sido
         * encontrado.
         */

        if (!slides.length) {
            return;
        }


        /*
         * -----------------------------------------------------
         * ESTADO
         * -----------------------------------------------------
         */

        let currentIndex = 0;
        let autoplayTimer = null;


        /*
         * -----------------------------------------------------
         * MOSTRAR SLIDE
         * -----------------------------------------------------
         */

        function showSlide(index) {

            /*
             * O operador módulo permite voltar ao primeiro
             * slide automaticamente depois do último.
             */

            currentIndex =
                (index + slides.length) % slides.length;


            slides.forEach((slide, slideIndex) => {

                const isActive =
                    slideIndex === currentIndex;


                slide.classList.toggle(
                    'is-active',
                    isActive
                );


                slide.classList.remove(
                    'is-entering'
                );


                /*
                 * Reinicia a animação sempre que o slide muda.
                 */

                if (isActive) {

                    void slide.offsetWidth;

                    slide.classList.add(
                        'is-entering'
                    );

                }

            });

        }


        /*
         * -----------------------------------------------------
         * PRÓXIMO SLIDE
         * -----------------------------------------------------
         */

        function nextSlide() {

            showSlide(currentIndex + 1);

        }


        /*
         * -----------------------------------------------------
         * AUTOPLAY
         * -----------------------------------------------------
         */

        function startAutoplay() {

            stopAutoplay();

            autoplayTimer = setInterval(
                nextSlide,
                SLIDE_INTERVAL
            );

        }


        /*
         * -----------------------------------------------------
         * PARAR AUTOPLAY
         * -----------------------------------------------------
         */

        function stopAutoplay() {

            if (autoplayTimer !== null) {

                clearInterval(autoplayTimer);

                autoplayTimer = null;

            }

        }


        /*
         * -----------------------------------------------------
         * VISIBILIDADE DA PÁGINA
         * -----------------------------------------------------
         *
         * Não há necessidade de continuar alternando as
         * mensagens enquanto o usuário está em outra aba.
         * -----------------------------------------------------
         */

        document.addEventListener(
            'visibilitychange',
            () => {

                if (document.hidden) {

                    stopAutoplay();

                } else {

                    startAutoplay();

                }

            }
        );


        /*
         * -----------------------------------------------------
         * REDUÇÃO DE MOVIMENTO
         * -----------------------------------------------------
         *
         * Caso o usuário tenha configurado o sistema para
         * reduzir animações, o slider permanece no primeiro
         * slide em vez de iniciar o autoplay.
         * -----------------------------------------------------
         */

        const prefersReducedMotion =
            window.matchMedia(
                '(prefers-reduced-motion: reduce)'
            );


        /*
         * -----------------------------------------------------
         * INICIALIZAÇÃO
         * -----------------------------------------------------
         */

        showSlide(0);


        if (!prefersReducedMotion.matches) {

            startAutoplay();

        }

    })();

</script>
